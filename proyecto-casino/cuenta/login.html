<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso VIP - Midnight Ingenium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../logo-casino.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">

    <style>
        .login-wrap {
            max-width: 450px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .login-card {
            background: var(--color-card, #16163a);
            border: 1px solid rgba(245, 197, 24, 0.2);
            border-radius: 20px;
            padding: 45px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            font-family: 'Rajdhani', sans-serif;
            position: relative;
        }

        .card-accent {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 5px;
            background: linear-gradient(90deg, transparent, var(--color-oro, #f5c518), transparent);
        }

        .login-card h2 {
            font-family: 'Cinzel', serif;
            color: #fff;
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 35px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            color: #aaa;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--color-oro, #f5c518);
            background: rgba(245, 197, 24, 0.05);
            box-shadow: 0 0 20px rgba(245, 197, 24, 0.15);
        }

        .btn-entrar {
            width: 100%;
            padding: 18px;
            background: var(--color-verde, #00ffae);
            color: #000;
            border: none;
            border-radius: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 10px;
        }

        .btn-entrar:hover {
            filter: brightness(1.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 174, 0.3);
        }

        .login-links {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 25px;
        }

        .login-links a {
            color: #777;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .login-links a:hover {
            color: var(--color-oro, #f5c518);
        }

        .register-text {
            color: #fff;
            font-weight: 700;
            margin-top: 10px;
            display: block;
        }

        .mensaje-error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="bg-pattern">

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <img src="../logo-casino.png" class="logo-small" alt="Logo">
        <span class="casino-name">Midnight Ingenium</span>
    </div>
</div>

<!-- NAVBAR -->
<nav class="navbar">
    <ul class="menu">
        <li><a href="../index.html">🏠 Inicio</a></li>
        <li><a href="registro.html">📝 Registro</a></li>
        <li><a href="login.html" style="color: var(--color-oro);">🔑 Login</a></li>
    </ul>
</nav>

<!-- HEADER -->
<header class="page-header" style="background: linear-gradient(rgba(10,10,31,0.95), rgba(10,10,31,0.98)), radial-gradient(circle at center, rgba(30,30,70,0.5) 0%, rgba(10,10,31,1) 70%); border-bottom: 2px solid rgba(245, 197, 24, 0.3); padding: 70px 20px;">
    <h1>Acceso al Salón VIP</h1>
    <p>Inicia sesión para gestionar tus fondos y apuestas</p>
</header>

<main class="login-wrap">

    <div class="login-card">
        <div class="card-accent"></div>
        <h2>🔒 Identificación</h2>

        <div class="mensaje-error" id="mensajeError"></div>

        <form id="formLogin">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="usuario@ingenium.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña Secreta</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-entrar" id="btnEntrar">Entrar a Jugar</button>

            <div class="login-links">
                <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
                <p style="color: #666; margin-top: 15px;">¿No tienes una cuenta aún?</p>
                <a href="registro.html" class="register-text">REGÍSTRATE GRATIS</a>
            </div>
        </form>
    </div>

</main>

<footer>
    <p>© 2026 Midnight Ingenium Casino · Jugando desde una conexión cifrada</p>
</footer>

<script>
    // Si ya hay sesión activa, redirigir al dashboard
    if (localStorage.getItem('token') && localStorage.getItem('usuario')) {
        window.location.href = '../cuenta/index.html';
    }

    document.getElementById('formLogin').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email       = document.getElementById('email').value.trim();
        const password    = document.getElementById('password').value;
        const btnEntrar   = document.getElementById('btnEntrar');
        const mensajeError = document.getElementById('mensajeError');

        // Validación básica
        if (!email || !password) {
            mensajeError.textContent = 'Por favor completa todos los campos';
            mensajeError.style.display = 'block';
            return;
        }

        btnEntrar.textContent = '⏳ Verificando...';
        btnEntrar.disabled = true;
        mensajeError.style.display = 'none';

        try {
            const res = await fetch('http://localhost:5000/api/usuarios/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (res.ok) {
                // Guardar token y usuario
                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', JSON.stringify(data));

                // Feedback visual antes de redirigir
                btnEntrar.textContent = '✅ Acceso concedido';
                btnEntrar.style.background = '#00ffae';

                setTimeout(() => {
                    window.location.href = '../cuenta/index.html';
                }, 800);

            } else {
                mensajeError.textContent = data.mensaje || 'Credenciales incorrectas';
                mensajeError.style.display = 'block';
                btnEntrar.textContent = 'Entrar a Jugar';
                btnEntrar.disabled = false;
            }

        } catch (error) {
            mensajeError.textContent = '❌ Error al conectar con el servidor. ¿Está corriendo el backend?';
            mensajeError.style.display = 'block';
            btnEntrar.textContent = 'Entrar a Jugar';
            btnEntrar.disabled = false;
        }
    });
</script>

</body>
</html>
