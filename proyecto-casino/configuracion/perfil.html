<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil - Midnight Ingenium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../logo-casino.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .profile-container { max-width:850px; margin:40px auto; padding:0 20px 80px; }
        .profile-grid { display:grid; grid-template-columns:1fr 2fr; gap:30px; }
        .status-sidebar {
            background:var(--color-card); border:1px solid rgba(245,197,24,0.2);
            border-radius:20px; padding:30px; text-align:center; height:fit-content;
        }
        .verify-badge {
            background:rgba(0,255,174,0.1); color:var(--color-verde);
            border:1px solid var(--color-verde); padding:5px 12px;
            border-radius:20px; font-size:0.75rem; font-family:'Rajdhani';
            font-weight:800; display:inline-block; margin-bottom:15px;
        }
        .profile-main-card {
            background:var(--color-card); border:1px solid rgba(255,255,255,0.05);
            border-radius:20px; padding:40px; box-shadow:0 20px 50px rgba(0,0,0,0.5);
        }
        .section-header {
            border-bottom:1px solid rgba(245,197,24,0.3);
            margin-bottom:25px; padding-bottom:10px;
        }
        .section-header h3 { font-family:'Cinzel',serif; color:var(--color-oro); font-size:1.1rem; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
        .form-group label {
            display:block; font-family:'Rajdhani',sans-serif; color:#aaa;
            font-size:0.8rem; margin-bottom:8px; text-transform:uppercase;
        }
        .form-input, .form-select {
            width:100%; background:rgba(0,0,0,0.3);
            border:1px solid rgba(255,255,255,0.1); border-radius:8px;
            padding:12px; color:#fff; font-family:'Rajdhani'; outline:none; transition:0.3s;
        }
        .form-input:focus  { border-color:var(--color-oro); }
        .form-select option { background:#16163a; }
        .btn-update {
            width:100%; background:var(--color-oro); color:#000; border:none;
            padding:18px; border-radius:12px; font-family:'Rajdhani'; font-weight:800;
            font-size:1.1rem; text-transform:uppercase; cursor:pointer; transition:0.3s; margin-top:20px;
        }
        .btn-update:hover { filter:brightness(1.2); transform:scale(1.01); }
        .btn-update:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        @media (max-width:768px) { .profile-grid { grid-template-columns:1fr; } .form-row { grid-template-columns:1fr; } }
    </style>
</head>
<body class="bg-pattern">

<div class="topbar">
    <div class="topbar-left">
        <img src="../logo-casino.png" class="logo-small" alt="Logo">
        <span class="casino-name">Midnight Ingenium</span>
    </div>
    <div class="topbar-right">
        <span class="saldo" id="saldo-display">💰 $0.00</span>
    </div>
</div>

<nav class="navbar">
    <ul class="menu">
        <li><a href="../index.html">🏠 Inicio</a></li>
        <li><a href="index.html">⚙️ Ajustes</a></li>
        <li><a href="perfil.html" style="color:var(--color-oro);">👤 Mi Perfil</a></li>
        <li><a href="../cuenta/login.html" class="btn-login" id="btn-sesion">Iniciar Sesión</a></li>
    </ul>
</nav>

<header class="page-header">
    <h1>👤 Mi Perfil</h1>
    <p>Actualiza tu información personal</p>
</header>

<main class="profile-container">
    <div class="profile-grid">

        <aside class="status-sidebar">
            <div class="verify-badge">✓ CUENTA ACTIVA</div>
            <div style="font-size:4rem; margin-bottom:15px;">👤</div>
            <h2 style="font-family:'Cinzel'; color:#fff; font-size:1.2rem;" id="sidebar-nombre">—</h2>
            <p style="font-family:'Rajdhani'; color:var(--color-oro);" id="sidebar-email">—</p>
            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:20px 0;">
            <p style="font-family:'Rajdhani'; color:#888; font-size:0.8rem;" id="sidebar-fecha">Cargando...</p>
        </aside>

        <div class="profile-main-card">
            <form id="profile-form">

                <div class="section-header"><h3>📋 Datos de Identidad</h3></div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" class="form-input" id="input-nombre" placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label>Correo Electrónico</label>
                        <input type="email" class="form-input" id="input-email" disabled
                               style="opacity:0.5; cursor:not-allowed;">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>País de Residencia</label>
                        <select class="form-select" id="input-pais">
                            <option value="CO">🇨🇴 Colombia</option>
                            <option value="MX">🇲🇽 México</option>
                            <option value="AR">🇦🇷 Argentina</option>
                            <option value="PE">🇵🇪 Perú</option>
                            <option value="CL">🇨🇱 Chile</option>
                            <option value="ES">🇪🇸 España</option>
                            <option value="US">🇺🇸 Estados Unidos</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" class="form-input" id="input-ciudad" placeholder="Tu ciudad">
                    </div>
                </div>

                <div class="section-header" style="margin-top:30px;"><h3>💎 Preferencias de Cuenta</h3></div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Moneda Principal</label>
                        <select class="form-select" id="input-moneda">
                            <option value="USD">USD - Dólar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="COP">COP - Peso Colombiano</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Formato de Cuotas</label>
                        <select class="form-select" id="input-cuotas">
                            <option value="decimal">Decimal (1.50)</option>
                            <option value="fraccional">Fraccional (1/2)</option>
                            <option value="americano">Americano (-200)</option>
                        </select>
                    </div>
                </div>

                <div id="error-perfil" style="display:none; color:#ff5555; background:rgba(255,50,50,0.1); padding:12px; border-radius:8px; margin-top:10px; font-size:0.9rem;"></div>

                <button type="button" class="btn-update" id="btn-guardar" onclick="guardarPerfil()">
                    💾 Guardar Cambios
                </button>

            </form>
        </div>
    </div>
</main>

<footer><p>© 2026 Midnight Ingenium Casino · Juego Responsable</p></footer>

<script src="../assets/js/main.js"></script>
<script>
    const _usuario  = JSON.parse(localStorage.getItem('usuario') || 'null');
    const _token    = localStorage.getItem('token');

    if (!_usuario || !_token) window.location.href = '../cuenta/login.html';

    // Cargar datos en el formulario
    function cargarDatos(u) {
        document.getElementById('input-nombre').value  = u.nombre       || '';
        document.getElementById('input-email').value   = u.email        || '';
        document.getElementById('input-ciudad').value  = u.ciudad       || '';
        document.getElementById('input-pais').value    = u.pais         || 'CO';
        document.getElementById('input-moneda').value  = u.moneda       || 'USD';
        document.getElementById('input-cuotas').value  = u.formatoCuotas || 'decimal';

        document.getElementById('sidebar-nombre').textContent = u.nombre || '—';
        document.getElementById('sidebar-email').textContent  = u.email  || '—';
        document.getElementById('saldo-display').textContent  =
            `💰 $${parseFloat(u.saldo || 0).toLocaleString(undefined, {minimumFractionDigits:2})}`;

        const btnSesion = document.getElementById('btn-sesion');
        if (btnSesion) {
            btnSesion.textContent = '👤 ' + u.nombre;
            btnSesion.href = '../cuenta/index.html';
            btnSesion.style.color = '#00ffae';
        }

        // Fecha de registro desde createdAt si existe
        if (u.createdAt) {
            const fecha = new Date(u.createdAt).toLocaleDateString('es-CO', { year:'numeric', month:'long' });
            document.getElementById('sidebar-fecha').textContent = 'Miembro desde: ' + fecha;
        }
    }

    cargarDatos(_usuario);

    // Sincronizar con API
    fetch('http://localhost:5000/api/usuarios/perfil', {
        headers: { 'Authorization': `Bearer ${_token}` }
    })
    .then(r => r.json())
    .then(perfil => {
        if (perfil?._id) {
            localStorage.setItem('usuario', JSON.stringify({ ...perfil, token: _token }));
            cargarDatos(perfil);
        }
    }).catch(() => {});

    async function guardarPerfil() {
        const btn    = document.getElementById('btn-guardar');
        const errEl  = document.getElementById('error-perfil');
        errEl.style.display = 'none';
        btn.disabled = true;
        btn.textContent = '⏳ Guardando...';

        const body = {
            nombre:        document.getElementById('input-nombre').value.trim(),
            ciudad:        document.getElementById('input-ciudad').value.trim(),
            pais:          document.getElementById('input-pais').value,
            moneda:        document.getElementById('input-moneda').value,
            formatoCuotas: document.getElementById('input-cuotas').value
        };

        if (!body.nombre) {
            errEl.style.display = 'block';
            errEl.textContent   = '❌ El nombre no puede estar vacío';
            btn.disabled        = false;
            btn.textContent     = '💾 Guardar Cambios';
            return;
        }

        try {
            const res  = await fetch('http://localhost:5000/api/usuarios/perfil', {
                method:  'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${_token}` },
                body:    JSON.stringify(body)
            });

            const data = await res.json();

            if (res.ok) {
                // Actualizar localStorage conservando el token
                const u = { ...data, token: _token };
                localStorage.setItem('usuario', JSON.stringify(u));
                cargarDatos(u);
                mostrarToast('✅ Perfil actualizado correctamente', 'exito');
            } else {
                errEl.style.display = 'block';
                errEl.textContent   = '❌ ' + (data.mensaje || 'Error al guardar');
            }

        } catch {
            errEl.style.display = 'block';
            errEl.textContent   = '❌ Error al conectar con el servidor';
        }

        btn.disabled    = false;
        btn.textContent = '💾 Guardar Cambios';
    }
</script>

</body>
</html>
