<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Idioma - Midnight Ingenium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../logo-casino.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .config-container { max-width:600px; margin:40px auto; padding:0 20px; }
        .settings-card {
            background:var(--color-card); border:1px solid rgba(245,197,24,0.2);
            border-radius:20px; padding:30px; box-shadow:0 15px 40px rgba(0,0,0,0.6); text-align:center;
        }
        .settings-card h2 { font-family:'Cinzel',serif; color:var(--color-oro); margin-bottom:25px; font-size:1.6rem; letter-spacing:2px; }
        .language-grid { display:grid; grid-template-columns:1fr; gap:15px; margin-bottom:30px; }
        .lang-option {
            background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1);
            border-radius:12px; padding:15px 25px; display:flex;
            align-items:center; justify-content:space-between; cursor:pointer; transition:all 0.3s;
        }
        .lang-option:hover  { border-color:var(--color-oro); background:rgba(245,197,24,0.05); }
        .lang-option.active { border-color:var(--color-verde); background:rgba(0,255,174,0.05); box-shadow:0 0 15px rgba(0,255,174,0.1); }
        .lang-info  { display:flex; align-items:center; gap:15px; }
        .lang-flag  { font-size:1.5rem; }
        .lang-name  { font-family:'Rajdhani',sans-serif; font-weight:600; color:#fff; font-size:1.1rem; }
        .lang-check { color:var(--color-verde); font-weight:900; display:none; }
        .lang-option.active .lang-check { display:block; }
        .btn-save {
            width:100%; background:var(--color-oro); color:#000; border:none; padding:15px;
            border-radius:10px; font-family:'Rajdhani',sans-serif; font-weight:800;
            font-size:1.1rem; text-transform:uppercase; letter-spacing:2px; cursor:pointer; transition:0.3s;
            box-shadow:0 0 20px rgba(245,197,24,0.3);
        }
        .btn-save:hover { transform:translateY(-2px); box-shadow:0 0 30px rgba(245,197,24,0.5); background:#fff; }
        input[type="radio"] { display:none; }
    </style>
</head>
<body class="bg-pattern">

<div class="topbar">
    <div class="topbar-left">
        <img src="../logo-casino.png" class="logo-small" alt="Logo">
        <span class="casino-name">Midnight Ingenium</span>
    </div>
    <div class="topbar-right">
        <span class="saldo" id="saldo-display">💰 $0.00</span>
    </div>
</div>

<nav class="navbar">
    <ul class="menu">
        <li><a href="../index.html">🏠 Inicio</a></li>
        <li><a href="index.html">⚙️ Ajustes</a></li>
        <li><a href="idioma.html" style="color:var(--color-oro);">🌎 Idioma</a></li>
        <li><a href="../cuenta/login.html" class="btn-login" id="btn-sesion">Iniciar Sesión</a></li>
    </ul>
</nav>

<header class="page-header">
    <h1>🌎 Preferencias de Idioma</h1>
    <p>Personaliza el idioma de la plataforma</p>
</header>

<main class="config-container">
    <div class="settings-card">
        <h2>Seleccionar Idioma</h2>
        <div class="language-grid">
            <label class="lang-option" data-lang="es">
                <input type="radio" name="idioma" value="es">
                <div class="lang-info"><span class="lang-flag">🇪🇸</span><span class="lang-name">Español (Latinoamérica)</span></div>
                <span class="lang-check">✓</span>
            </label>
            <label class="lang-option" data-lang="en">
                <input type="radio" name="idioma" value="en">
                <div class="lang-info"><span class="lang-flag">🇺🇸</span><span class="lang-name">English (Global)</span></div>
                <span class="lang-check">✓</span>
            </label>
            <label class="lang-option" data-lang="pt">
                <input type="radio" name="idioma" value="pt">
                <div class="lang-info"><span class="lang-flag">🇧🇷</span><span class="lang-name">Português (Brasil)</span></div>
                <span class="lang-check">✓</span>
            </label>
        </div>
        <button class="btn-save" onclick="guardarIdioma()">Guardar Cambios</button>
    </div>
</main>

<footer><p>© 2026 Midnight Ingenium Casino · v2.4.0</p></footer>

<script src="../assets/js/main.js"></script>
<script>
    const _usuario  = JSON.parse(localStorage.getItem('usuario') || 'null');
    const _token    = localStorage.getItem('token');

    if (!_usuario || !_token) window.location.href = '../cuenta/login.html';

    if (_usuario) {
        document.getElementById('saldo-display').textContent =
            `💰 $${parseFloat(_usuario.saldo || 0).toLocaleString(undefined, {minimumFractionDigits:2})}`;
        const btnSesion = document.getElementById('btn-sesion');
        if (btnSesion) {
            btnSesion.textContent = '👤 ' + _usuario.nombre;
            btnSesion.href = '../cuenta/index.html';
            btnSesion.style.color = '#00ffae';
        }
    }

    // Cargar idioma guardado
    const idiomaGuardado = localStorage.getItem('idioma') || 'es';
    document.querySelectorAll('.lang-option').forEach(opt => {
        if (opt.dataset.lang === idiomaGuardado) opt.classList.add('active');
        opt.addEventListener('click', () => {
            document.querySelectorAll('.lang-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
        });
    });

    function guardarIdioma() {
        const activo = document.querySelector('.lang-option.active');
        if (activo) {
            localStorage.setItem('idioma', activo.dataset.lang);
            mostrarToast('✅ Idioma guardado correctamente', 'exito');
        }
    }
</script>

</body>
</html>
