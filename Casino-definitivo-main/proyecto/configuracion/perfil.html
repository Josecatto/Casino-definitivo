<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perfil Pro - Midnight Ingenium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../logo-casino.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">

    <style>
        .profile-container { max-width: 850px; margin: 40px auto; padding: 0 20px 80px; }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        /* Columna Izquierda: Status Card */
        .status-sidebar {
            background: var(--color-card);
            border: 1px solid rgba(245, 197, 24, 0.2);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            height: fit-content;
        }

        .verify-badge {
            background: rgba(0, 255, 174, 0.1);
            color: var(--color-verde);
            border: 1px solid var(--color-verde);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-family: 'Rajdhani';
            font-weight: 800;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* Columna Derecha: Formulario Extendido */
        .profile-main-card {
            background: var(--color-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .section-header {
            border-bottom: 1px solid rgba(245, 197, 24, 0.3);
            margin-bottom: 25px;
            padding-bottom: 10px;
        }

        .section-header h3 {
            font-family: 'Cinzel', serif;
            color: var(--color-oro);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-family: 'Rajdhani', sans-serif;
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-input, .form-select {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-family: 'Rajdhani';
            outline: none;
            transition: 0.3s;
        }

        .form-input:focus { border-color: var(--color-oro); }

        .social-link {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            font-family: 'Rajdhani';
            font-size: 0.9rem;
            color: #fff;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .social-link:hover { border-color: #55acee; background: rgba(85, 172, 238, 0.1); }

        .btn-update {
            width: 100%;
            background: var(--color-oro);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-family: 'Rajdhani';
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-update:hover { filter: brightness(1.2); transform: scale(1.01); }

        @media (max-width: 768px) {
            .profile-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>

</main>
