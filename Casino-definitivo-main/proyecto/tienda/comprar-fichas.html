<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Comprar Fichas - Midnight Ingenium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../logo-casino.png">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
/* Estilos específicos para las cards de compra */
.promo-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 20px;
}

.promo-card {
    background: #1e1e1e;
    color: #fff;
    border-radius: 15px;
    padding: 20px;
    width: 200px;
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

.promo-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 12px 20px rgba(0,0,0,0.5);
}

.promo-card h3 {
    font-size: 1.8rem;
    margin-bottom: 10px;
}

.promo-card p {
    margin-bottom: 15px;
}

.promo-card .btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #f39c12;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
}

.promo-card .btn:hover {
    background: #e67e22;
}
</style>
</head>
<body>

<header class="hero small-hero">
    <div class="hero-content">
        <img src="../casino-header.png" class="hero-logo" alt="Midnight Ingenium Logo">
        <h1>💰 Comprar Fichas</h1>
    </div>
</header>

<main class="promo-container">

<div class="promo-card">
    <h3>$20</h3>
    <p>Recibe 2,000 fichas</p>
    <button class="btn">Comprar</button>
</div>

<div class="promo-card">
    <h3>$50</h3>
    <p>Recibe 6,000 fichas</p>
    <button class="btn">Comprar</button>
</div>

<div class="promo-card">
    <h3>$100</h3>
    <p>Recibe 15,000 fichas</p>
    <button class="btn">Comprar</button>
</div>

</main>

</body>
</html>
