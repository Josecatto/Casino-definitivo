<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comprar Fichas | Midnight Ingenium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../logo-casino.png">
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #f5c518;
            --gold-glow: rgba(245, 197, 24, 0.4);
            --dark-bg: #050510;
            --glass: rgba(20, 20, 40, 0.8);
        }

        body { 
            background: var(--dark-bg); 
            color: #e0e0e0; 
            margin: 0; 
            font-family: 'Rajdhani', sans-serif; 
            background-image: radial-gradient(circle at top right, #1a1a3a, transparent);
            min-height: 100vh;
        }

        /* --- TOPBAR CON LOGO --- */
        .topbar { 
            display: flex; justify-content: flex-start; align-items: center; 
            padding: 15px 30px; background: #0a0a1a; border-bottom: 1px solid #1a1a3a; gap: 12px;
        }
        .logo-small { width: 35px; height: 35px; filter: drop-shadow(0 0 5px var(--gold-glow)); }
        .casino-name { font-family: 'Cinzel', serif; color: var(--gold); font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; }
        
        /* --- NAVBAR CON EMOJIS --- */
        .navbar { 
            background: #11112a; padding: 12px 0; border-bottom: 1px solid var(--gold); 
            position: sticky; top: 0; z-index: 100;
        }
        .menu { list-style: none; display: flex; justify-content: center; gap: 25px; margin: 0; padding: 0; }
        .menu a { 
            color: white; text-decoration: none; font-weight: 700; font-size: 0.9rem; 
            text-transform: uppercase; display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .menu a:hover { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); transform: translateY(-2px); }

        /* --- HERO --- */
        .hero {
            text-align: center;
            padding: 50px 20px;
        }
        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold-glow);
            margin: 0;
        }

        /* --- CONTENEDOR DE CARDS --- */
        .promo-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            padding: 20px 20px 100px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .promo-card {
            background: var(--glass);
            border: 1px solid rgba(245, 197, 24, 0.15);
            color: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            width: 260px;
            text-align: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(15px);
            position: relative;
            overflow: hidden;
        }

        .promo-card::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
            opacity: 0;
            transition: 0.5s;
        }

        .promo-card:hover {
            transform: translateY(-15px);
            border-color: var(--gold);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow);
        }

        .promo-card:hover::before { opacity: 0.3; }

        .promo-card h3 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--gold);
            margin: 10px 0;
        }

        .promo-card .chips-amount {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* BOTÓN DE COMPRA */
        .btn-buy {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--gold), #ffecb3);
            color: #000;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-buy:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--gold);
            letter-spacing: 1px;
        }

        /* ETIQUETA RECOMENDADO */
        .featured {
            border-color: var(--gold);
            transform: scale(1.05);
        }
        .badge {
            background: var(--gold);
            color: #000;
            position: absolute;
            top: 15px;
            right: -30px;
            padding: 5px 40px;
            transform: rotate(45deg);
            font-weight: 900;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        footer { text-align: center; padding: 60px; color: #444; border-top: 1px solid #1a1a3a; }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <div class="topbar">
        <img src="../logo-casino.png" class="logo-small" alt="Logo">
        <span class="casino-name">Midnight Ingenium</span>
    </div>

    <!-- NAVBAR -->

    <nav class="navbar">
        <ul class="menu">
            <li><a href="../index.html">🏠 Inicio</a></li>
        </ul>
    </nav>

    <main class="promo-container">

        <div class="promo-card">
            <span style="font-size: 3rem;">🪙</span>
            <h3>$20</h3>
            <p class="chips-amount">2,000 Fichas</p>
            <button class="btn-buy">Comprar ahora</button>
        </div>

        <div class="promo-card featured">
            <div class="badge">Popular</div>
            <span style="font-size: 3rem;">💎</span>
            <h3>$50</h3>
            <p class="chips-amount">6,000 Fichas</p>
            <button class="btn-buy">Comprar ahora</button>
        </div>

        <div class="promo-card">
            <span style="font-size: 3rem;">🏆</span>
            <h3>$100</h3>
            <p class="chips-amount">15,000 Fichas</p>
            <button class="btn-buy">Comprar ahora</button>
        </div>

    </main>

    <footer>
        <p>© 2026 Midnight Ingenium Casino · Transacciones seguras y encriptadas.</p>
    </footer>

</body>
</html>
