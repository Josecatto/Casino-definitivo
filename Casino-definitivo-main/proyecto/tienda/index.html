<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda Hub | Midnight Ingenium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../logo-casino.png">
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #f5c518;
            --gold-glow: rgba(245, 197, 24, 0.3);
            --dark-bg: #050510;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(245, 197, 24, 0.1);
        }

        body { 
            background: var(--dark-bg); 
            color: #e0e0e0; 
            margin: 0; 
            font-family: 'Rajdhani', sans-serif; 
            background-image: radial-gradient(circle at top right, #1a1a3a, transparent);
            min-height: 100vh;
        }

        /* --- TOPBAR CON LOGO --- */
        .topbar { 
            display: flex; justify-content: flex-start; align-items: center; 
            padding: 15px 30px; background: #0a0a1a; border-bottom: 1px solid #1a1a3a; gap: 12px;
        }
        .logo-small { width: 35px; height: 35px; filter: drop-shadow(0 0 5px var(--gold-glow)); }
        .casino-name { font-family: 'Cinzel', serif; color: var(--gold); font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; }
        
        /* --- NAVBAR CON EMOJIS --- */
        .navbar { 
            background: #11112a; padding: 12px 0; border-bottom: 1px solid var(--gold); 
            position: sticky; top: 0; z-index: 100;
        }
        .menu { list-style: none; display: flex; justify-content: center; gap: 25px; margin: 0; padding: 0; }
        .menu a { 
            color: white; text-decoration: none; font-weight: 700; font-size: 0.9rem; 
            text-transform: uppercase; display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .menu a:hover { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); transform: translateY(-2px); }

        /* --- HERO --- */
        .hero {
            text-align: center;
            padding: 60px 20px 40px;
        }
        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold-glow);
            margin: 0;
        }

        /* --- CONTENEDOR DE CARDS --- */
        .info-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto 100px;
        }

        /* --- ESTILO DE CADA CARD (Navegación) --- */
        .info-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            width: 240px;
            border-radius: 20px;
            text-decoration: none;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .info-card:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
            background: rgba(245, 197, 24, 0.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 15px var(--gold-glow);
        }

        .info-card h3 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .info-card:hover h3 {
            color: var(--gold);
        }

        /* Iconos grandes dentro de las cards */
        .card-icon {
            font-size: 3rem;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
        }

        footer { text-align: center; padding: 60px; color: #444; border-top: 1px solid #1a1a3a; }

        @media (max-width: 600px) {
            .info-card { width: 100%; max-width: 300px; }
            .hero h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <div class="topbar">
        <img src="../logo-casino.png" class="logo-small" alt="Logo">
        <span class="casino-name">Midnight Ingenium</span>
    </div>

    <!-- NAVBAR CON EMOJIS -->
    <nav class="navbar">
        <ul class="menu">
            <li><a href="../index.html">🏠 Inicio</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>🛒 Centro de Finanzas</h1>
        <p style="color: #666; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-top: 10px;">Gestión de Créditos y Retiros</p>
    </header>

    <main class="info-container">

        <a href="comprar-fichas.html" class="info-card">
            <span class="card-icon">💰</span>
            <h3>Comprar Fichas</h3>
        </a>

        <a href="metodos-pago.html" class="info-card">
            <span class="card-icon">💳</span>
            <h3>Métodos de Pago</h3>
        </a>

        <a href="retiros.html" class="info-card">
            <span class="card-icon">🏦</span>
            <h3>Retiros</h3>
        </a>

    </main>

    <footer>
        <p>© 2026 Midnight Ingenium Casino · Seguridad Bancaria Garantizada.</p>
    </footer>

</body>
</html>
