<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Métodos de Pago | Midnight Ingenium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../logo-casino.png">
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #f5c518;
            --gold-glow: rgba(245, 197, 24, 0.4);
            --dark-bg: #050510;
            --glass: rgba(20, 20, 40, 0.7);
        }

        body { 
            background: var(--dark-bg); 
            color: #e0e0e0; 
            margin: 0; 
            font-family: 'Rajdhani', sans-serif; 
            background-image: radial-gradient(circle at top right, #1a1a3a, transparent);
            min-height: 100vh;
        }

        /* --- TOPBAR CON LOGO --- */
        .topbar { 
            display: flex; justify-content: flex-start; align-items: center; 
            padding: 15px 30px; background: #0a0a1a; border-bottom: 1px solid #1a1a3a; gap: 12px;
        }
        .logo-small { width: 35px; height: 35px; filter: drop-shadow(0 0 5px var(--gold-glow)); }
        .casino-name { font-family: 'Cinzel', serif; color: var(--gold); font-weight: 900; font-size: 1.4rem; letter-spacing: 1px; }
        
        /* --- NAVBAR MINIMALISTA --- */
        .navbar { 
            background: #11112a; padding: 12px 0; border-bottom: 1px solid var(--gold); 
            position: sticky; top: 0; z-index: 100;
        }
        .menu { list-style: none; display: flex; justify-content: center; margin: 0; padding: 0; }
        .menu a { 
            color: white; text-decoration: none; font-weight: 700; font-size: 1rem; 
            text-transform: uppercase; display: flex; align-items: center; gap: 8px; transition: 0.3s;
        }
        .menu a:hover { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); transform: translateY(-2px); }

        /* --- HERO --- */
        .hero {
            text-align: center;
            padding: 50px 20px 20px;
        }
        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold-glow);
            margin: 0;
        }

        /* --- CONTENEDOR DE PAGOS --- */
        .info-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 40px 20px 80px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- ESTILO DE CADA MÉTODO --- */
        .payment-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            text-align: center;
            padding: 35px 20px;
            width: 200px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.4s;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .payment-card:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
            background: rgba(245, 197, 24, 0.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 15px var(--gold-glow);
        }

        /* Iconos de pago */
        .payment-card span {
            display: block;
            font-size: 3rem;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.1));
            transition: 0.3s;
        }

        .payment-card:hover span {
            transform: scale(1.1);
            filter: drop-shadow(0 0 12px var(--gold));
        }

        footer { text-align: center; padding: 60px; color: #444; border-top: 1px solid #1a1a3a; }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <div class="topbar">
        <!-- El logo sube un nivel para buscarlo en la raíz -->
        <img src="../logo-casino.png" class="logo-small" alt="Logo">
        <span class="casino-name">Midnight Ingenium</span>
    </div>

    <!-- NAVBAR SOLO INICIO -->
    <nav class="navbar">
        <ul class="menu">
            <li><a href="../index.html">🏠 Regresar al Inicio</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>💳 Métodos de Pago</h1>
        <p style="color: #666; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;">Pasarelas de seguridad bancaria</p>
    </header>

    <main class="info-container">

        <div class="payment-card">
            <span>💳</span>
            <div>Tarjeta Visa / Mastercard</div>
        </div>

        <div class="payment-card">
            <span>🏦</span>
            <div>Transferencia Bancaria</div>
        </div>

        <div class="payment-card">
            <span style="color: var(--gold);">₿</span>
            <div>Criptomonedas</div>
        </div>

        <div class="payment-card">
            <span>🅿️</span>
            <div>PayPal / Digital</div>
        </div>

    </main>

    <footer>
        <p>© 2026 Midnight Ingenium Casino · Transacciones 100% Seguras</p>
    </footer>

</body>
</html>
