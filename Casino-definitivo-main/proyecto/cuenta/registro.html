<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro - Midnight Ingenium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../logo-casino.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <img src="../logo-casino.png" class="logo-small" alt="Logo">
        <span class="casino-name">Midnight Ingenium</span>
    </div>
</div>

<nav class="navbar">
    <ul class="menu">
        <li><a href="../index.html">🏠 Inicio</a></li>
        <li><a href="login.html">🔑 Login</a></li>
    </ul>
</nav>

<div class="page-header">
    <h1>📝 Crear Cuenta</h1>
    <p>Únete al casino más exclusivo — Bono de bienvenida hasta $500</p>
</div>

<div class="form-container">
    <!--
        TEMA 16: FORMULARIO HTML5 COMPLETO
        Alojado externamente en Formspree para verificación de datos.
        Reemplaza YOUR_FORM_ID con tu ID de Formspree: https://formspree.io
    -->
    <form class="casino-form"
          action="https://formspree.io/f/xgopvlql"
          method="POST"
          id="form-registro">

        <h2>🎰 Nueva Cuenta</h2>

        <!-- TEMA 16: Diferentes tipos de input -->
        <div class="form-group">
            <label for="nombre">👤 Nombre Completo *</label>
            <input type="text"
                   id="nombre" name="nombre"
                   placeholder="Ej: Juan Pérez"
                   required
                   minlength="3"
                   autocomplete="name">
        </div>

        <div class="form-group">
            <label for="email">📧 Correo Electrónico *</label>
            <input type="email"
                   id="email" name="email"
                   placeholder="correo@ejemplo.com"
                   required
                   autocomplete="email">
        </div>

        <div class="form-group">
            <label for="usuario">🎮 Nombre de Usuario *</label>
            <input type="text"
                   id="usuario" name="usuario"
                   placeholder="Mi_Usuario_Casino"
                   required
                   minlength="4"
                   maxlength="20"
                   pattern="[a-zA-Z0-9_]+"
                   title="Solo letras, números y guiones bajos">
        </div>

        <div class="form-group">
            <label for="password">🔒 Contraseña *</label>
            <input type="password"
                   id="password" name="password"
                   placeholder="Mínimo 8 caracteres"
                   required
                   minlength="8"
                   autocomplete="new-password">
        </div>

        <div class="form-group">
            <label for="password2">🔒 Confirmar Contraseña *</label>
            <input type="password"
                   id="password2" name="password2"
                   placeholder="Repite tu contraseña"
                   required
                   autocomplete="new-password">
        </div>

        <div class="form-group">
            <label for="telefono">📱 Teléfono</label>
            <input type="tel"
                   id="telefono" name="telefono"
                   placeholder="+57 300 000 0000"
                   autocomplete="tel">
        </div>

        <div class="form-group">
            <label for="fecha-nac">🎂 Fecha de Nacimiento * (Mayor de 18)</label>
            <input type="date"
                   id="fecha-nac" name="fecha_nacimiento"
                   required
                   max="">
        </div>

        <div class="form-group">
            <label for="pais">🌎 País *</label>
            <select id="pais" name="pais" required>
                <option value="">Selecciona tu país</option>
                <option value="CO" selected>🇨🇴 Colombia</option>
                <option value="MX">🇲🇽 México</option>
                <option value="AR">🇦🇷 Argentina</option>
                <option value="PE">🇵🇪 Perú</option>
                <option value="CL">🇨🇱 Chile</option>
                <option value="VE">🇻🇪 Venezuela</option>
                <option value="EC">🇪🇨 Ecuador</option>
                <option value="BO">🇧🇴 Bolivia</option>
                <option value="UY">🇺🇾 Uruguay</option>
                <option value="PY">🇵🇾 Paraguay</option>
                <option value="ES">🇪🇸 España</option>
                <option value="US">🇺🇸 Estados Unidos</option>
            </select>
        </div>

        <div class="form-group">
            <label for="moneda">💱 Moneda Preferida</label>
            <select id="moneda" name="moneda">
                <option value="COP">COP - Peso Colombiano</option>
                <option value="USD">USD - Dólar Americano</option>
                <option value="MXN">MXN - Peso Mexicano</option>
                <option value="ARS">ARS - Peso Argentino</option>
                <option value="PEN">PEN - Sol Peruano</option>
                <option value="CLP">CLP - Peso Chileno</option>
                <option value="EUR">EUR - Euro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="codigo-bono">🎁 Código de Bono (opcional)</label>
            <input type="text"
                   id="codigo-bono" name="codigo_bono"
                   placeholder="MIDNIGHT500">
        </div>

        <!-- TIPO RANGE -->
        <div class="form-group">
            <label for="limite-diario">💰 Límite de depósito diario: $<span id="limite-val">100</span> USD</label>
            <input type="range"
                   id="limite-diario" name="limite_diario"
                   min="10" max="10000" step="10" value="100"
                   style="width:100%; accent-color:#f5c518;"
                   oninput="document.getElementById('limite-val').textContent = this.value">
        </div>

        <!-- Checkboxes -->
        <div class="form-group" style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="mayor-edad" name="mayor_edad" required style="width:auto; accent-color:#f5c518;">
            <label for="mayor-edad" style="margin-bottom:0; cursor:pointer;">
                Confirmo que tengo <strong>18 años o más</strong> *
            </label>
        </div>

        <div class="form-group" style="display:flex; align-items:flex-start; gap:10px;">
            <input type="checkbox" id="terminos" name="terminos" required style="width:auto; accent-color:#f5c518; margin-top:3px;">
            <label for="terminos" style="margin-bottom:0; cursor:pointer; font-size:0.9rem;">
                Acepto los <a href="../legal/terminos.html" target="_blank" style="color:#00ffae;">Términos y Condiciones</a>
                y la <a href="../legal/privacidad.html" target="_blank" style="color:#00ffae;">Política de Privacidad</a> *
            </label>
        </div>

        <div class="form-group" style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="marketing" name="marketing" style="width:auto; accent-color:#f5c518;">
            <label for="marketing" style="margin-bottom:0; cursor:pointer; font-size:0.9rem;">
                Acepto recibir ofertas y promociones por email
            </label>
        </div>

        <!-- Campo oculto: origen -->
        <input type="hidden" name="_subject" value="Nuevo registro - Midnight Ingenium Casino">
        <input type="hidden" name="_next" value="../cuenta/bienvenida.html">
        <input type="hidden" name="_captcha" value="false">

        <div id="error-form" style="display:none; color:#ff5555; background:rgba(255,50,50,0.1); padding:12px; border-radius:8px; margin-bottom:10px; font-size:0.9rem;"></div>

        <button type="submit" class="btn-glow" style="width:100%; padding:16px; font-size:1.1rem;">
            🎰 Crear Mi Cuenta Gratis
        </button>

        <div class="form-links">
            <a href="login.html">¿Ya tienes cuenta? Iniciar sesión</a>
        </div>
    </form>
</div>

<footer>
    <p>© 2026 Midnight Ingenium Casino · 🔒 Datos seguros con SSL 256-bit</p>
</footer>

<script src="../assets/js/main.js"></script>
<script>
// Establecer fecha máxima (18 años atrás)
const hoy = new Date();
hoy.setFullYear(hoy.getFullYear() - 18);
document.getElementById('fecha-nac').max = hoy.toISOString().split('T')[0];

// Validación de formulario
document.getElementById('form-registro').addEventListener('submit', function(e) {
    const pass  = document.getElementById('password').value;
    const pass2 = document.getElementById('password2').value;
    const errEl = document.getElementById('error-form');

    if (pass !== pass2) {
        e.preventDefault();
        errEl.style.display = 'block';
        errEl.textContent   = '❌ Las contraseñas no coinciden';
        return;
    }
    errEl.style.display = 'none';
    mostrarToast('✅ Registrando tu cuenta...', 'exito');
});
</script>
</body>
</html>
