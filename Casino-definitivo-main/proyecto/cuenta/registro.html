<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Midnight Ingenium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="../logo-casino.png">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="hero small-hero">
    <div class="hero-content">
        <img src="../casino-header.png" class="hero-logo" alt="Midnight Ingenium Logo">
        <h1>Crear Cuenta</h1>
    </div>
</header>

<main class="form-container">

<form class="casino-form">

    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" placeholder="Tu nombre completo" required>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="correo@ejemplo.com" required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" required>

    <label for="confirm">Confirmar contraseña</label>
    <input type="password" id="confirm" placeholder="••••••••" required>

    <button type="submit" class="btn">Registrarse</button>

</form>

</main>

<footer>
    <p>© 2026 Midnight Ingenium Casino</p>
</footer>

</body>
</html>
