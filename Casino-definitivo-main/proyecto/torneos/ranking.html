<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ranking | Midnight Ingenium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
/* HEADER */
.main-header {
    text-align: center;
    padding: 25px 10px;
    background: #1a1a1a;
    color: #fff;
}

.main-header .hero-logo {
    width: 120px;
    margin-bottom: 15px;
}

.main-header nav a {
    color: #ff9900;
    margin: 0 15px;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.3s;
}

.main-header nav a:hover {
    color: #ff6a00;
}

/* RANKING TABLE */
.ranking-container {
    padding: 30px;
    display: flex;
    justify-content: center;
}

.ranking-container table {
    border-collapse: collapse;
    width: 90%;
    max-width: 800px;
    background: #1e1e1e;
    color: #fff;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 6px 15px rgba(0,0,0,0.5);
}

.ranking-container th, 
.ranking-container td {
    padding: 15px;
    text-align: center;
    border-bottom: 1px solid #333;
}

.ranking-container th {
    background: #ff9900;
    color: #1a1a1a;
    font-size: 1.1em;
}

.ranking-container tr:hover {
    background: rgba(255, 153, 0, 0.2);
    transform: scale(1.01);
    transition: all 0.2s ease-in-out;
}

/* POSICIONES DESTACADAS */
.ranking-container td:first-child {
    font-weight: bold;
    font-size: 1.2em;
}

.ranking-container tr:nth-child(1) td {
    background: linear-gradient(90deg, #ffd700, #ffea00);
    color: #000;
    font-weight: bold;
}

.ranking-container tr:nth-child(2) td {
    background: linear-gradient(90deg, #c0c0c0, #e0e0e0);
    color: #000;
    font-weight: bold;
}

.ranking-container tr:nth-child(3) td {
    background: linear-gradient(90deg, #cd7f32, #e6b07c);
    color: #000;
    font-weight: bold;
}
</style>
</head>
<body>

<header class="main-header">
    <h1>🏅 Ranking Global</h1>
    <img src="../casino-header.png" class="hero-logo" alt="Midnight Ingenium Logo">
    <nav>
        <a href="torneos.html">Torneos</a>
        <a href="../index.html">Inicio</a>
    </nav>
</header>

<section class="ranking-container">
    <table>
        <thead>
            <tr>
                <th>Posición</th>
                <th>Jugador</th>
                <th>Puntos</th>
                <th>Premio</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>🥇 1</td>
                <td>ShadowKing</td>
                <td>15,420</td>
                <td>$3,000</td>
            </tr>
            <tr>
                <td>🥈 2</td>
                <td>DarkAce</td>
                <td>13,210</td>
                <td>$2,000</td>
            </tr>
            <tr>
                <td>🥉 3</td>
                <td>MidnightWolf</td>
                <td>11,980</td>
                <td>$1,000</td>
            </tr>
        </tbody>
    </table>
</section>

</body>
</html>
