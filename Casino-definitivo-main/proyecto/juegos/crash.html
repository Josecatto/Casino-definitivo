<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crash - Midnight Ingenium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../logo-casino.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        :root {
            --neon-green: #00ffae;
            --neon-red: #ff4444;
            --neon-gold: #f5c518;
            --bg-dark: #050510;
        }

        body {
            background: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a1a3a 0%, #050510 100%);
            color: white;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        /* --- ESTILOS DE NAVEGACIÓN (Consistencia) --- */
        .topbar { 
            display: flex; 
            justify-content: space-between; 
            padding: 15px 30px; 
            background: #000; 
            border-bottom: 2px solid #333; 
            align-items: center;
        }
        .casino-name { 
            font-family: 'Cinzel', serif; 
            font-size: 1.2rem; 
            color: var(--neon-gold); 
            text-decoration: none;
        }
        .saldo { color: var(--neon-green); font-weight: 700; font-size: 1.2rem; }

        .navbar .menu { 
            display: flex; 
            list-style: none; 
            gap: 20px; 
            justify-content: center; 
            background: #111; 
            padding: 12px; 
            margin: 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .navbar a { text-decoration: none; color: #aaa; font-weight: 600; transition: 0.3s; font-size: 0.9rem; }
        .navbar a:hover { color: var(--neon-gold); }

        /* --- CONTENEDOR CRASH --- */
        .crash-viewport {
            max-width: 900px;
            margin: 40px auto;
            position: relative;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 24px;
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            text-align: center;
        }

        #multiplicador-display {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem;
            font-weight: 900;
            font-family: 'Cinzel', serif;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 40px rgba(0,255,174,0.5);
            transition: color 0.2s;
        }

        #crash-canvas {
            width: 100%;
            height: 450px;
            background: #020208;
            border-radius: 16px;
            display: block;
        }

        /* PANEL DE MANDOS */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            align-items: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 1px;
        }

        .crash-input {
            background: #0a0a1f;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            padding: 10px;
            font-size: 1.1rem;
            font-family: 'Rajdhani';
            font-weight: bold;
            outline: none;
            text-align: center;
            width: 100%;
            max-width: 140px;
        }

        .crash-input:focus { border-color: var(--neon-green); }

        .btn-action {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 1.3rem;
            font-family: 'Rajdhani';
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-bet { background: linear-gradient(90deg, #00ffae, #00d4ff); color: #000; }
        .btn-cash { background: linear-gradient(90deg, #f5c518, #ff9a00); color: #000; }
        .btn-action:disabled { filter: grayscale(1); opacity: 0.2; cursor: not-allowed; }
        .btn-action:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 5px 20px rgba(0,255,174,0.4); }

        /* HISTORIAL */
        .historial-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 20px;
            justify-content: center;
            background: rgba(0,0,0,0.3);
        }

        .h-badge {
            padding: 5px 15px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            font-weight: bold;
            font-family: 'Rajdhani';
            border: 1px solid rgba(255,255,255,0.1);
            min-width: 60px;
            text-align: center;
        }
        
        footer { text-align: center; padding: 30px; color: #444; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <a href="../index.html" class="casino-name">🚀 Midnight Crash</a>
    </div>
    <div class="topbar-right">
        <span class="saldo" id="saldo-display">💰 $1,250.00</span>
    </div>
</div>

<nav class="navbar">
    <ul class="menu">
        <li><a href="../index.html">🏠 Inicio</a></li>
        <li><a href="index.html">🎮 Juegos</a></li>
        <li><a href="blackjack.html">🃏 Blackjack</a></li>
        <li><a href="ruleta.html">🎡 Ruleta</a></li>
        <li><a href="slots.html">🎰 Slots</a></li>
    </ul>
</nav>

<div class="crash-viewport">
    <div id="multiplicador-display">1.00x</div>
    <canvas id="crash-canvas" width="800" height="450"></canvas>

    <div class="controls-grid">
        <div class="input-group">
            <label>Monto apuesta</label>
            <input type="number" id="bet-amount" class="crash-input" value="10" min="1">
        </div>
        <div class="input-group">
            <label>Auto-Retiro (x)</label>
            <input type="number" id="auto-cashout" class="crash-input" value="2.00" step="0.1">
        </div>
        <div class="input-group">
            <button id="btn-bet" class="btn-action btn-bet" onclick="placeBet()">🚀 Apostar</button>
            <button id="btn-cash" class="btn-action btn-cash" onclick="cashOut()" style="display:none;">💰 Retirar</button>
        </div>
        <div class="input-group">
            <div id="flight-status" style="font-weight: bold; color: var(--neon-gold);">ESPERANDO...</div>
            <div id="profit-preview" style="color: var(--neon-green); font-size: 1.2rem; min-height: 24px;"></div>
        </div>
    </div>
</div>

<div class="historial-bar" id="history-container"></div>

<footer>
    <p>© 2026 Midnight Ingenium Casino · Juego Responsable · 18+</p>
</footer>

<script>
    let saldo = parseFloat(localStorage.getItem('saldo')) || 1250;
    let playing = false;
    let betted = false;
    let hasCashedOut = false;
    let multiplier = 1.0;
    let crashPoint = 0;
    let betAmount = 0;
    let points = [];
    const canvas = document.getElementById('crash-canvas');
    const ctx = canvas.getContext('2d');

    function updateUI() {
        document.getElementById('saldo-display').textContent = `💰 $${saldo.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        localStorage.setItem('saldo', saldo);
    }

    function generateCrash() {
        const r = Math.random();
        if (r < 0.03) return 1.00; // Casa gana 3% instantáneo
        return (Math.max(1.0, (1 / (1 - Math.random()) * 0.97))).toFixed(2);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        for(let i=0; i<canvas.width; i+=50) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }
        for(let i=0; i<canvas.height; i+=50) {
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        if (points.length < 2) return;

        ctx.beginPath();
        ctx.lineWidth = 5;
        ctx.strokeStyle = playing ? '#00ffae' : '#ff4444';
        ctx.shadowBlur = 15;
        ctx.shadowColor = ctx.strokeStyle;

        const margin = 50;
        const maxTime = Math.max(100, points.length);
        const maxMult = Math.max(2, multiplier * 1.1);

        points.forEach((p, i) => {
            const x = margin + (i / maxTime) * (canvas.width - margin * 2);
            const y = (canvas.height - margin) - ((p - 1) / (maxMult - 1)) * (canvas.height - margin * 2);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.shadowBlur = 0;

        const lastX = margin + ((points.length - 1) / maxTime) * (canvas.width - margin * 2);
        const lastY = (canvas.height - margin) - ((multiplier - 1) / (maxMult - 1)) * (canvas.height - margin * 2);
        
        ctx.font = '40px Arial';
        ctx.fillText(playing ? '🚀' : '💥', lastX - 20, lastY + 15);
    }

    function startFlight() {
        multiplier = 1.0;
        points = [1.0];
        crashPoint = generateCrash();
        playing = true;
        hasCashedOut = false;
        
        document.getElementById('flight-status').textContent = "🚀 EN VUELO";
        document.getElementById('flight-status').style.color = "var(--neon-green)";
        document.getElementById('profit-preview').textContent = "";
        document.getElementById('profit-preview').style.color = "var(--neon-green)";

        const loop = setInterval(() => {
            if (!playing) { clearInterval(loop); return; }

            multiplier += 0.004 * (Math.pow(multiplier, 1.1));
            points.push(multiplier);

            const display = document.getElementById('multiplicador-display');
            display.textContent = multiplier.toFixed(2) + 'x';
            display.style.color = multiplier >= 2 ? (multiplier >= 10 ? '#ff4444' : '#f5c518') : '#00ffae';

            if (betted && !hasCashedOut) {
                const profit = (betAmount * multiplier).toFixed(2);
                document.getElementById('profit-preview').textContent = `+ $${profit}`;
                if (multiplier >= parseFloat(document.getElementById('auto-cashout').value)) cashOut();
            }

            draw();

            if (multiplier >= crashPoint) {
                clearInterval(loop);
                endFlight();
            }
        }, 50);
    }

    function endFlight() {
        playing = false;
        document.getElementById('flight-status').textContent = "💥 CRASH!";
        document.getElementById('flight-status').style.color = "var(--neon-red)";
        document.getElementById('multiplicador-display').textContent = crashPoint + 'x';
        
        if (betted && !hasCashedOut) {
            document.getElementById('profit-preview').textContent = "PERDISTE";
            document.getElementById('profit-preview').style.color = "var(--neon-red)";
        }

        const badge = document.createElement('div');
        badge.className = 'h-badge';
        badge.textContent = crashPoint + 'x';
        badge.style.color = crashPoint > 2 ? '#f5c518' : '#00ffae';
        const container = document.getElementById('history-container');
        container.prepend(badge);
        if(container.children.length > 10) container.lastChild.remove();

        betted = false;
        document.getElementById('btn-bet').style.display = "block";
        document.getElementById('btn-cash').style.display = "none";
        document.getElementById('btn-bet').disabled = true;
        
        setTimeout(() => {
            document.getElementById('btn-bet').disabled = false;
            startFlight();
        }, 4000);
    }

    function placeBet() {
        if (playing) return; 
        betAmount = parseFloat(document.getElementById('bet-amount').value);
        if (betAmount > saldo || betAmount <= 0) return alert("Saldo insuficiente o apuesta inválida");
        
        saldo -= betAmount;
        betted = true;
        updateUI();
        document.getElementById('btn-bet').style.display = "none";
        document.getElementById('btn-cash').style.display = "block";
    }

    function cashOut() {
        if (!betted || !playing || hasCashedOut) return;
        const win = betAmount * multiplier;
        saldo += win;
        hasCashedOut = true;
        updateUI();
        document.getElementById('btn-cash').style.display = "none";
        document.getElementById('flight-status').textContent = "✅ RETIRADO";
        document.getElementById('profit-preview').textContent = `GANASTE $${win.toFixed(2)}`;
    }

    updateUI();
    startFlight();
</script>

</body>
</html>
