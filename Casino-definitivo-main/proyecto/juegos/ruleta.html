<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ruleta Royal - Midnight Ingenium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../logo-casino.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #f5c518;
            --gold-glow: rgba(245, 197, 24, 0.5);
            --dark-bg: #050510;
            --wine: #8b0000;
        }

        body { background: var(--dark-bg); color: white; margin: 0; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }

        /* --- TOPBAR & NAVBAR --- */
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #0a0a1a; border-bottom: 1px solid #1a1a3a; }
        .topbar-left { display: flex; align-items: center; gap: 10px; }
        .logo-small { width: 30px; height: 30px; }
        .casino-name { font-family: 'Cinzel', serif; color: var(--gold); font-weight: 900; font-size: 1.2rem; }
        .saldo { color: var(--gold); font-weight: 700; font-size: 1.1rem; }

        .navbar { background: #11112a; padding: 12px 0; border-bottom: 1px solid var(--gold); }
        .menu { list-style: none; display: flex; justify-content: center; gap: 30px; margin: 0; padding: 0; }
        .menu a { color: white; text-decoration: none; font-weight: 700; transition: 0.3s; font-size: 0.9rem; text-transform: uppercase; }
        .menu a:hover { color: var(--gold); }

        /* --- HEADER & JACKPOT --- */
        .page-header { text-align: center; padding: 25px 20px 10px; }
        .page-header h1 { font-family: 'Cinzel', serif; margin: 0; color: white; font-size: 2.2rem; }
        
        .jackpot-container { max-width: 500px; margin: 10px auto 25px; }
        .jackpot-display {
            background: linear-gradient(135deg, rgba(245,197,24,0.15), rgba(0,0,0,0.8));
            border: 2px solid var(--gold); border-radius: 15px; padding: 15px; text-align: center;
            box-shadow: 0 0 20px rgba(245,197,24,0.2);
        }
        .jackpot-label { font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--gold); letter-spacing: 2px; }
        .jackpot-amount { font-family: 'Cinzel', serif; font-size: 2.8rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px var(--gold); }

        /* --- CONTENEDOR DE JUEGO --- */
        .main-wrapper { display: flex; justify-content: center; padding: 20px; }
        
        .maquina-ruleta {
            background: linear-gradient(160deg, #1a1a2e, #0f0f1f);
            border: 4px solid; border-image: linear-gradient(135deg, #f5c518, #ff9a00, #f5c518) 1;
            border-radius: 20px; padding: 40px;
            display: flex; flex-direction: row; align-items: center; justify-content: center;
            gap: 50px; flex-wrap: wrap; max-width: 1200px;
            box-shadow: 0 0 80px rgba(0,0,0,0.5);
        }

        /* --- RULETA LADO IZQUIERDO --- */
        .ruleta-box { text-align: center; flex: 1; min-width: 380px; position: relative; }
        #ruleta-canvas { max-width: 100%; height: auto; filter: drop-shadow(0 0 15px rgba(0,0,0,0.5)); }
        #numero-resultado { 
            font-family: 'Cinzel', serif; font-size: 5.5rem; font-weight: 900; margin: 15px 0; 
            min-height: 100px; color: var(--gold); text-shadow: 0 0 20px var(--gold-glow);
        }

        /* --- MESA LADO DERECHO --- */
        .mesa-container { flex: 1.2; min-width: 500px; }
        
        .fichas-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; }
        .ficha-btn {
            background: rgba(255,255,255,0.05); border: 2px solid rgba(245,197,24,0.3);
            color: white; padding: 10px 18px; border-radius: 8px; cursor: pointer;
            font-weight: 700; transition: 0.3s; font-family: 'Rajdhani';
        }
        .ficha-btn.activo { background: var(--gold); color: black; border-color: white; transform: translateY(-3px); }

        /* GRID DEL TABLERO */
        .betting-grid { display: flex; justify-content: center; margin-bottom: 15px; }
        .btn-zero { background: #1a7a1a; border: 1px solid #00ff88; width: 50px; color: white; font-weight: 900; border-radius: 10px 0 0 10px; cursor: pointer; }
        .numeros-wrapper { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
        .btn-num { width: 42px; height: 50px; border: 1px solid #444; color: white; font-weight: 700; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .n-rojo { background: var(--wine); }
        .n-negro { background: #111; }
        .btn-num:hover { border-color: var(--gold); }
        
        .cols-btns { display: flex; flex-direction: column; gap: 4px; margin-left: 4px; }
        .btn-col { height: 50px; width: 45px; background: #1a1a3a; border: 1px solid #444; color: white; font-size: 0.7rem; border-radius: 0 10px 10px 0; cursor: pointer; }

        .externas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 8px 54px; }
        .final-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-left: 54px; }
        .btn-ext { background: #1a1a3a; border: 1px solid #444; color: white; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.8rem; }
        
        .apuesta-activa { border: 2px solid var(--gold) !important; box-shadow: 0 0 10px var(--gold); background: rgba(245,197,24,0.2) !important; }

        #btn-spin {
            width: 100%; padding: 20px; margin-top: 25px; background: var(--gold);
            border: none; border-radius: 12px; font-family: 'Cinzel', serif; font-weight: 900;
            font-size: 1.8rem; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 0 #b8860b;
        }
        #btn-spin:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8860b; }
        #btn-spin:disabled { background: #444; box-shadow: none; cursor: not-allowed; }

        #info-mesa { text-align: center; margin-top: 15px; font-size: 1.1rem; color: #aaa; }
        #msg-final { height: 30px; text-align: center; font-weight: 900; font-size: 1.4rem; margin-top: 10px; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <img src="../logo-casino.png" class="logo-small">
        <span class="casino-name">Midnight Ingenium</span>
    </div>
    <div class="topbar-right">
        <span class="saldo" id="saldo-user">💰 $1,250</span>
    </div>
</div>

<nav class="navbar">
    <ul class="menu">
        <li><a href="../index.html">🏠 Inicio</a></li>
        <li><a href="index.html">🎮 Juegos</a></li>
        <li><a href="ruleta.html" style="color:var(--gold)">🎡 Ruleta</a></li>
        <li><a href="slots.html">🎰 Slots</a></li>
    </ul>
</nav>

<div class="page-header">
    <h1>RULETA ROYAL PREMIUM</h1>
</div>

<div class="jackpot-container">
    <div class="jackpot-display">
        <div class="jackpot-label">JACKPOT ACUMULADO</div>
        <div class="jackpot-amount">$48,290.15</div>
    </div>
</div>

<div class="main-wrapper">
    <div class="maquina-ruleta">
        <!-- RULETA VISUAL -->
        <div class="ruleta-box">
            <canvas id="ruleta-canvas" width="400" height="400"></canvas>
            <div id="numero-resultado">--</div>
            <div id="msg-final"></div>
        </div>

        <!-- TABLERO DE APUESTAS -->
        <div class="mesa-container">
            <div class="fichas-selector">
                <button class="ficha-btn" onclick="setFicha(1, this)">$1</button>
                <button class="ficha-btn activo" onclick="setFicha(10, this)">$10</button>
                <button class="ficha-btn" onclick="setFicha(50, this)">$50</button>
                <button class="ficha-btn" onclick="setFicha(100, this)">$100</button>
            </div>

            <div class="betting-grid">
                <button class="btn-zero" onclick="placeBet('0', this)">0</button>
                <div class="numeros-wrapper" id="grid-36"></div>
                <div class="cols-btns">
                    <button class="btn-col" onclick="placeBet('c3', this)">2:1</button>
                    <button class="btn-col" onclick="placeBet('c2', this)">2:1</button>
                    <button class="btn-col" onclick="placeBet('c1', this)">2:1</button>
                </div>
            </div>

            <div class="externas-grid">
                <button class="btn-ext" onclick="placeBet('d1', this)">1st 12</button>
                <button class="btn-ext" onclick="placeBet('d2', this)">2nd 12</button>
                <button class="btn-ext" onclick="placeBet('d3', this)">3rd 12</button>
            </div>

            <div class="final-grid">
                <button class="btn-ext" onclick="placeBet('1-18', this)">1-18</button>
                <button class="btn-ext" onclick="placeBet('par', this)">EVEN</button>
                <button class="btn-ext" style="background:var(--wine)" onclick="placeBet('rojo', this)">RED</button>
                <button class="btn-ext" style="background:#000" onclick="placeBet('negro', this)">BLACK</button>
                <button class="btn-ext" onclick="placeBet('impar', this)">ODD</button>
                <button class="btn-ext" onclick="placeBet('19-36', this)">19-36</button>
            </div>

            <div id="info-mesa">MESA: <span id="total-mesa" style="color:var(--gold)">$0</span></div>
            <button id="btn-spin" onclick="girarRuleta()">GIRAR RULETA</button>
            <div style="text-align:center; margin-top:10px;">
                <button onclick="resetMesa()" style="background:none; border:none; color:#666; cursor:pointer; text-decoration:underline">Limpiar mesa</button>
            </div>
        </div>
    </div>
</div>

<script>
    const NUMEROS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
    const ROJOS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    
    let fichaSel = 10;
    let apuestas = {};
    let totalApostado = 0;
    let estaGirando = false;
    let anguloActual = 0;

    // Generar Tablero
    const grid = document.getElementById('grid-36');
    for(let i=1; i<=12; i++){
        for(let j=3; j>=1; j--){
            let n = (i-1)*3 + j;
            let btn = document.createElement('button');
            btn.className = `btn-num ${ROJOS.includes(n) ? 'n-rojo' : 'n-negro'}`;
            btn.textContent = n;
            btn.onclick = () => placeBet(n.toString(), btn);
            btn.style.gridRow = 4-j; btn.style.gridColumn = i;
            grid.appendChild(btn);
        }
    }

    const canvas = document.getElementById('ruleta-canvas');
    const ctx = canvas.getContext('2d');

    function drawRuleta(ang) {
        ctx.clearRect(0,0,400,400);
        const slice = (Math.PI*2)/37;
        NUMEROS.forEach((n, i) => {
            const start = ang + i*slice;
            ctx.beginPath(); ctx.moveTo(200,200);
            ctx.arc(200,200,190, start, start+slice);
            ctx.fillStyle = n === 0 ? '#1a7a1a' : (ROJOS.includes(n) ? '#8b0000' : '#111');
            ctx.fill(); ctx.strokeStyle = 'rgba(245,197,24,0.4)'; ctx.lineWidth = 2; ctx.stroke();
            
            ctx.save(); ctx.translate(200,200); ctx.rotate(start + slice/2);
            ctx.fillStyle = "white"; ctx.font = "bold 14px Arial";
            ctx.fillText(n, 160, 5); ctx.restore();
        });
        // Flecha
        ctx.fillStyle = "#f5c518"; ctx.beginPath();
        ctx.moveTo(190, 0); ctx.lineTo(210, 0); ctx.lineTo(200, 35); ctx.fill();
    }

    function setFicha(v, btn) {
        fichaSel = v;
        document.querySelectorAll('.ficha-btn').forEach(b => b.classList.remove('activo'));
        btn.classList.add('activo');
    }

    function placeBet(tipo, btn) {
        if(estaGirando) return;
        apuestas[tipo] = (apuestas[tipo] || 0) + fichaSel;
        totalApostado += fichaSel;
        document.getElementById('total-mesa').textContent = `$${totalApostado}`;
        btn.classList.add('apuesta-activa');
    }

    function resetMesa() {
        if(estaGirando) return;
        apuestas = {}; totalApostado = 0;
        document.getElementById('total-mesa').textContent = "$0";
        document.querySelectorAll('.apuesta-activa').forEach(b => b.classList.remove('apuesta-activa'));
        document.getElementById('msg-final').textContent = "";
    }

    function girarRuleta() {
        if(estaGirando || totalApostado === 0) return;
        
        let saldo = parseFloat(localStorage.getItem('saldo') || 1250);
        if(totalApostado > saldo) return alert("Saldo insuficiente");

        estaGirando = true;
        localStorage.setItem('saldo', saldo - totalApostado);
        updateSaldoVisual();
        document.getElementById('btn-spin').disabled = true;

        const vueltas = 8 + Math.random() * 5;
        const angFinal = anguloActual + (vueltas * Math.PI * 2) + Math.random() * Math.PI * 2;
        const startT = performance.now();

        function animate(now) {
            let p = (now - startT) / 5000;
            if (p > 1) p = 1;
            const ease = 1 - Math.pow(1 - p, 3);
            anguloActual = angFinal * ease;
            drawRuleta(anguloActual);
            if (p < 1) requestAnimationFrame(animate);
            else checkResult();
        }
        requestAnimationFrame(animate);
    }

    function checkResult() {
        estaGirando = false;
        document.getElementById('btn-spin').disabled = false;
        const slice = (Math.PI*2)/37;
        const normalize = (1.5 * Math.PI - anguloActual) % (Math.PI * 2);
        const idx = Math.floor((normalize < 0 ? normalize + Math.PI*2 : normalize) / slice) % 37;
        const n = NUMEROS[idx];
        
        document.getElementById('numero-resultado').textContent = n;
        document.getElementById('numero-resultado').style.color = n === 0 ? '#00ff88' : (ROJOS.includes(n) ? '#ff4444' : 'white');

        let premio = 0;
        for(let [ap, monto] of Object.entries(apuestas)) {
            if(ap == n) premio += monto * 36;
            else if(ap === 'rojo' && ROJOS.includes(n)) premio += monto * 2;
            else if(ap === 'negro' && !ROJOS.includes(n) && n !== 0) premio += monto * 2;
            else if(ap === 'par' && n % 2 === 0 && n !== 0) premio += monto * 2;
            else if(ap === 'impar' && n % 2 !== 0) premio += monto * 2;
            // ... (añadir más reglas si deseas)
        }

        if(premio > 0) {
            let s = parseFloat(localStorage.getItem('saldo'));
            localStorage.setItem('saldo', s + premio);
            document.getElementById('msg-final').innerHTML = `<span style="color:#00ffae">¡GANASTE $${premio}!</span>`;
        } else {
            document.getElementById('msg-final').innerHTML = `<span style="color:#ff6666">SUERTE LA PRÓXIMA</span>`;
        }
        updateSaldoVisual();
        setTimeout(resetMesa, 3000);
    }

    function updateSaldoVisual() {
        let s = localStorage.getItem('saldo') || 1250;
        document.getElementById('saldo-user').textContent = `💰 $${parseFloat(s).toLocaleString()}`;
    }

    updateSaldoVisual();
    drawRuleta(0);
</script>

</body>
</html>
